<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gemplex | Login</title>
    <script>
      (function(){
        try {
          var theme = localStorage.getItem("gemplex-theme");
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          var city = localStorage.getItem("gemplex-selected-city") || "all";
          document.documentElement.classList.add("gemplex-theme-preload");
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.cityTheme = city;
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.classList.add("gemplex-theme-preload");
          document.documentElement.dataset.theme = "dark";
          document.documentElement.dataset.cityTheme = "all";
        }
      })();
    </script>
    <script src="js/theme.js?v=4"></script>
    <link rel="stylesheet" href="css/styles.css?v=179">
  </head>
  <body class="ott-flow-page auth-page">
    <header class="flow-topbar">
      <a class="brand" href="javascript:void(0)" aria-label="Gemplex">
        <img class="brand-logo" src="assets/gemplex-logo-teal.png?v=3" alt="Gemplex">
      </a>
      <a class="flow-link" href="index.html">Back Home</a>
    </header>

    <main class="auth-shell">
      <section class="auth-card">
        <h1>Secure Gemplex Access</h1>
        <p>Sign up or log in securely with Google, Email/Password, or mobile OTP. Only authorized users can play premium videos and interact with protected Gemplex AI features.</p>

        <button class="secondary-btn auth-provider-btn" id="googleLoginButton" type="button">
          <span class="google-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" focusable="false">
              <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.6 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c10 0 19-7.3 19-20 0-1.3-.1-2.4-.4-3.5z"/>
              <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.2 4 9.4 8.5 6.3 14.7z"/>
              <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.5-5.2l-6.2-5.2C29.3 35.1 26.8 36 24 36c-5.4 0-9.9-3.5-11.4-8.4l-6.6 5.1C9.1 39.4 16.1 44 24 44z"/>
              <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4 5.6l6.2 5.2C36.9 39.3 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
            </svg>
          </span>
          Continue with Google
        </button>

        <div class="auth-divider" aria-hidden="true"><span>or</span></div>

        <form id="phoneOtpForm">
          <label>
            <span>Mobile number</span>
            <input id="firebasePhoneInput" type="tel" placeholder="+91 98765 43210" autocomplete="tel" required>
          </label>
          <button class="primary-btn" id="phoneOtpButton" type="submit">Send OTP</button>
        </form>

        <form id="verifyOtpForm" hidden>
          <label>
            <span>Enter OTP</span>
            <input id="firebaseOtpInput" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6 digit OTP" minlength="4" maxlength="8" required>
          </label>
          <button class="primary-btn" id="verifyOtpButton" type="submit">Verify OTP</button>
          <button class="auth-text-btn" id="changePhoneButton" type="button">Change mobile number</button>
        </form>

        <div id="firebaseRecaptcha" aria-hidden="true"></div>

        <div class="auth-divider" aria-hidden="true"><span>or</span></div>

        <form id="firebaseForm" autocomplete="off">
          <label>
            <span>Email address</span>
            <input id="firebaseEmailInput" type="email" placeholder="Enter email address" autocomplete="off" data-no-autofill="true" required>
          </label>
          <label>
            <span>Password</span>
            <input id="firebasePasswordInput" type="password" placeholder="Enter password" autocomplete="new-password" data-no-autofill="true" minlength="6" required>
          </label>
          <button class="primary-btn" id="firebaseLoginButton" type="submit">Login with Email</button>
        </form>

        <button class="auth-text-btn" id="authModeButton" type="button">New to Gemplex? Create an account</button>

        <p class="auth-note" id="authMessage" aria-live="polite"></p>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-auth.js?v=12"></script>
    <script src="js/auth-client.js"></script>
    <script src="js/login.js?v=15"></script>
  </body>
</html>
